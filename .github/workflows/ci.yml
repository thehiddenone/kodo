name: Kodo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      id: checkout_code
      uses: actions/checkout@v4

    - name: Set up Python
      id: setup_python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install hatch
      id: install_hatch
      run: pipx install hatch

    - name: Run checks (fmt, lint, typecheck, version sync, tests)
      id: check
      run: hatch run check

  build:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      id: checkout_code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check whether build_number changed in this push
      id: filter
      run: |
        before="${{ github.event.before }}"
        if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
          before=$(git hash-object -t tree /dev/null)
        fi
        if git diff --name-only "$before" "${{ github.sha }}" | grep -qx 'build_number'; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Python
      if: steps.filter.outputs.changed == 'true'
      id: setup_python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install hatch
      if: steps.filter.outputs.changed == 'true'
      id: install_hatch
      run: pipx install hatch

    - name: Build wheel and source distribution
      if: steps.filter.outputs.changed == 'true'
      id: build
      run: hatch build

    - name: Upload build artifacts
      if: steps.filter.outputs.changed == 'true'
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: kodo-latest
        path: dist/
